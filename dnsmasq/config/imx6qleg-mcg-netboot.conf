# MCG Global netboot profile for imx6qleg-mcg (linux-dps-kirkstone)

# Basic DNS functionality
port=53
domain-needed
bogus-priv

# Interface binding (reuses the mining-excavator segment for netbooting)
interface=enx00e04cb828b5
listen-address=127.0.0.1
listen-address=192.168.3.1
bind-dynamic

# DHCP range for the machine network
dhcp-range=192.168.3.10,192.168.3.90,12h
dhcp-range=192.168.3.92,192.168.3.220,12h

# Hand out router, DNS, NTP and NFS root to clients on this network
dhcp-option=option:router,192.168.3.1
dhcp-option=option:dns-server,192.168.3.1
dhcp-option=option:ntp-server,192.168.3.1
dhcp-option=option:root-path,/opt/netboot/linux-dps-kirkstone/root/imx6qleg-mcg

# Note: Both root and image folders are exported via NFS for netboot and flashing
# root-path points to rootfs; image folder must be mounted separately by device

# Keep the UGREEN NAS alias available while flashing
address=/ugreen-nas/192.168.3.91

# TFTP export used by U-Boot netboot
enable-tftp
tftp-root=/opt/netboot
dhcp-boot=interface:enx00e04cb828b5,boot/imx6qleg-mcg/fitImage,imx6qleg-mcg,192.168.3.1

# Logging for troubleshooting
log-facility=/var/log/dnsmasq.log
log-dhcp
log-queries
