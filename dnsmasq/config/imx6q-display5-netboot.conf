# LMT DC5 (imx6q-display5) netboot profile

# Basic DNS functionality
port=53
domain-needed
bogus-priv

# Interface binding: NOT the same USB2Ethernet dongle as the mcg/mining-excavator
# profiles - enx00e04cb828b5 currently carries Machine-mining-excavator-GW
# (192.168.3.x). The 192.168.2.x segment (Machine-lpo-CSM-GW) is currently bound
# to enx00e04c6805c8. Verify with `ip -4 addr show` / `nmcli device status` before
# reusing this profile, as Machine-* NM profiles can be reassigned between
# physical adapters.
interface=enx00e04c6805c8
listen-address=127.0.0.1
listen-address=192.168.2.1
bind-dynamic

# DHCP range for the machine network (static ipaddr is set in u-boot, this is a
# fallback / for the Linux-side interface when not using the ip= kernel bootarg)
dhcp-range=192.168.2.10,192.168.2.100,12h

# Pin dc5-dev2's u-boot ethaddr to its static IP for consistency
dhcp-host=00:11:b8:1f:79:cf,192.168.2.130,infinite

# Hand out router, DNS, NTP and NFS root to clients on this network
dhcp-option=option:router,192.168.2.1
dhcp-option=option:dns-server,192.168.2.1
dhcp-option=option:ntp-server,192.168.2.1
dhcp-option=option:root-path,/opt/netboot/linux-lmt-display-scarthgap/root/imx6q-display5

# Note: Both root and image folders are exported via NFS for netboot and flashing
# root-path points to rootfs; image folder must be mounted separately by device

# TFTP export used by U-Boot netboot (download_kernel dhcp/tftp of fitImage)
# Note: dnsmasq's dhcp-boot only strips a "tag:" prefix, NOT "interface:" - an
# "interface:" prefix here is silently treated as the boot filename itself
# (breaking dhcp-boot entirely). Interface scoping is already handled by the
# global `interface=` directive above, so no per-option prefix is needed here.
enable-tftp
tftp-root=/opt/netboot
dhcp-boot=boot/imx6q-display5/fitImage,imx6q-display5,192.168.2.1

# Logging for troubleshooting
log-facility=/var/log/dnsmasq.log
log-dhcp
log-queries
